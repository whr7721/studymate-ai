<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyMate AI - 408 选择题练习</title>
  <style>
    :root{
      --bg:#f3efe8;--card:#faf8f5;--text:#18212f;--muted:#4b5563;--primary:#1e3a5f;
      --success:#16a34a;--danger:#dc2626;--border:#e5e7eb;--shadow:0 12px 30px rgba(15,23,42,.08);--radius:18px;
    }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at top,#f8f4ee 0%,var(--bg) 48%,#efe8dc 100%);color:var(--text);}
    .app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:24px;gap:18px}
    .header,.panel,.footer{background:rgba(250,248,245,.96);border:1px solid rgba(229,231,235,.95);border-radius:var(--radius);box-shadow:var(--shadow)}
    .header{padding:20px 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .brand h1,.history-title{margin:0}
    .brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
    .header-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-left:auto}
    .stats{display:flex;gap:12px;flex-wrap:wrap}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 14px;min-width:110px}
    .stat .label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.stat .value{font-weight:700;font-size:18px}
    .toggle{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-size:14px;font-weight:700;cursor:pointer}
    .toggle input{position:absolute;opacity:0;pointer-events:none}.switch{width:48px;height:28px;border-radius:999px;background:#d1d5db;padding:3px;display:inline-flex;align-items:center}.switch-knob{width:22px;height:22px;border-radius:50%;background:#fff;transform:translateX(0);transition:.2s}
    .toggle input:checked + .switch{background:var(--primary)} .toggle input:checked + .switch .switch-knob{transform:translateX(20px)}
    .icon-btn,.history-close{border:none;border-radius:999px;cursor:pointer}
    .icon-btn{width:42px;height:42px;background:var(--card);color:var(--primary);border:1px solid var(--border);font-size:20px;font-weight:800}
    .tabs{display:flex;gap:10px;flex-wrap:wrap}
    .tab{border:1px solid var(--border);background:#fff;color:var(--text);padding:10px 16px;border-radius:999px;font-size:14px;cursor:pointer}
    .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .year-select{border:1px solid var(--border);background:#fff;padding:10px 16px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--text)}
    .year-select:disabled{opacity:.45;cursor:not-allowed}
    .badge-stack{display:grid;gap:8px;justify-items:start}
    .badge.source{background:rgba(30,58,95,.08);color:var(--primary)}
    .rag-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    .rag-input{width:100%;min-height:80px;border:1px solid var(--border);border-radius:14px;padding:12px 14px;font:inherit;resize:vertical;background:#fff}
    .rag-status{color:var(--muted);font-size:14px;margin-top:8px}
    .rag-answer{margin-top:12px;line-height:1.8;border-left:3px solid var(--primary);padding:2px 0 2px 12px}
    .rag-sources{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.7}
    .rag-sources-title{font-weight:700;margin-bottom:4px}
    .feedback .btn{margin-top:10px}
    .main{display:grid;gap:18px;flex:1}.panel{padding:22px}
    .question-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px;align-items:flex-start}
    .question-meta{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}.badge,.progress,.timer{display:inline-flex;align-items:center}
    .badge{padding:7px 12px;border-radius:999px;background:rgba(201,168,76,.16);color:#7b5f16;font-size:13px;font-weight:700}.progress{font-size:13px;color:var(--muted)}
    .timer{min-width:78px;justify-content:center;padding:7px 12px;border-radius:999px;border:1px solid #d7e0ec;background:#eef2f7;color:var(--primary);font-size:13px;font-weight:800}
    .timer.danger{color:var(--danger);background:#fff1f2;border-color:#fecaca}.hidden{display:none !important}
    .question-text{font-size:22px;line-height:1.55;margin:0 0 18px;font-weight:700}
    .options{display:grid;gap:12px}.option{border:1px solid var(--border);border-radius:16px;padding:14px 16px;background:#fff;cursor:pointer;display:flex;gap:12px;align-items:flex-start;text-align:left}
    .option.selected{border-color:var(--primary);background:#eef2f7}.option.correct{border-color:var(--success);background:linear-gradient(180deg,#f4fbf5,#fff)}.option.wrong{border-color:var(--danger);background:linear-gradient(180deg,#fff4f4,#fff)}
    .option-key{width:30px;height:30px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 30px;background:#f3f4f6;color:#374151}.option.selected .option-key{background:var(--primary);color:#fff}.option.correct .option-key{background:var(--success);color:#fff}.option.wrong .option-key{background:var(--danger);color:#fff}
    .option-content{flex:1}.option-content .title{font-weight:600;line-height:1.55}
    .footer{padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
    .feedback{min-height:88px;border-radius:16px;border:1px dashed #cbd5e1;padding:14px 16px;background:#fbfaf7}.feedback.empty{color:var(--muted);display:flex;align-items:center}.feedback.success{border-color:rgba(22,163,74,.35);background:linear-gradient(180deg,#f5fbf6,#fffdfa)}.feedback.error{border-color:rgba(220,38,38,.35);background:linear-gradient(180deg,#fff5f5,#fffdfa)}.feedback .title{font-weight:800;margin-bottom:8px}.feedback .analysis{margin-top:8px;color:#374151;line-height:1.75}
    .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:none;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}.btn:disabled{cursor:not-allowed;opacity:.55}.btn-primary{background:var(--primary);color:#fff}.btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
    .history-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.38);z-index:90}.history-modal[aria-hidden="true"]{display:none}
    .history-panel{width:min(760px,100%);max-height:min(80vh,720px);overflow:auto;background:rgba(250,248,245,.98);border:1px solid rgba(229,231,235,.95);border-radius:22px;box-shadow:0 24px 50px rgba(15,23,42,.2);padding:20px}
    .history-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.history-title{font-size:20px}.history-close{width:34px;height:34px;background:#f3f4f6;color:#111827;font-size:22px;line-height:1}
    .history-empty{color:var(--muted);padding:16px;border:1px dashed #cbd5e1;border-radius:16px;background:#fbfaf7}.history-groups{display:grid;gap:16px}.history-group{border:1px solid var(--border);border-radius:18px;background:#fff;padding:14px}.history-group-title{margin:0 0 10px;font-size:15px;color:var(--primary)}.history-list{display:grid;gap:10px}
    .history-item{width:100%;border:1px solid #e5e7eb;border-radius:14px;background:#faf8f5;padding:12px 14px;text-align:left;cursor:pointer}.history-item-main{display:flex;gap:10px;flex-wrap:wrap;font-weight:700}.history-item-answer{margin-top:6px;color:var(--muted);font-size:14px}
    .help-popover{position:fixed;top:78px;right:24px;width:min(320px,calc(100vw - 32px));background:rgba(255,255,255,.96);border:1px solid rgba(229,231,235,.95);border-radius:18px;box-shadow:0 18px 36px rgba(15,23,42,.16);padding:14px 16px;z-index:50;opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:.18s}.help-popover.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.help-popover-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.help-popover-title{margin:0;font-size:15px}.help-popover-close{width:28px;height:28px;border:none;border-radius:999px;background:#f3f4f6;color:#111827;font-size:18px;cursor:pointer;line-height:1}
    @media (max-width:900px){.footer{grid-template-columns:1fr}.actions{justify-content:flex-start}.header-tools{margin-left:0}.help-popover{top:72px;right:16px}}
    @media (max-width:640px){.app{padding:14px}.panel,.footer,.header{padding:16px}.question-text{font-size:19px}.question-head{flex-direction:column}.question-meta{justify-content:flex-start}}
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <h1>StudyMate AI · 408 选择题练习</h1>
        <p>按科目切换题目，选择答案后查看对错和解析。</p>
      </div>
      <div class="header-tools">
        <div class="stats">
          <div class="stat"><span class="label">当前科目</span><span class="value" id="currentSubject">数据结构</span></div>
          <div class="stat"><span class="label">已作答</span><span class="value"><span id="answeredCount">0</span>/<span id="totalCount">--</span></span></div>
          <div class="stat"><span class="label">正确数</span><span class="value" id="correctCount">0</span></div>
          <div class="stat"><span class="label">正确率</span><span class="value" id="accuracyRate">0%</span></div>
        </div>
        <label class="toggle" for="timerToggle"><span>计时器</span><input type="checkbox" id="timerToggle" aria-label="计时器开关" /><span class="switch" aria-hidden="true"><span class="switch-knob"></span></span></label>
        <button class="icon-btn" id="helpBtn" type="button" aria-label="查看使用说明">?</button>
      </div>
    </header>

    <nav class="tabs" id="subjectTabs" aria-label="科目切换">
      <button class="tab active" data-subject="数据结构">数据结构</button>
      <button class="tab" data-subject="组成原理">组成原理</button>
      <button class="tab" data-subject="操作系统">操作系统</button>
      <button class="tab" data-subject="计算机网络">计算机网络</button>
    </nav>

    <nav class="tabs filter-bar" id="filterBar" aria-label="题目范围筛选">
      <button class="tab active" data-qtype="all">全部题目</button>
      <button class="tab" data-qtype="exam">历年真题</button>
      <button class="tab" data-qtype="chapter">章节练习</button>
      <select class="year-select" id="yearSelect" aria-label="真题年份" disabled>
        <option value="">全部年份</option>
      </select>
    </nav>

    <main class="main">
      <section class="panel">
        <div class="question-head">
          <div class="badge-stack">
            <div class="badge" id="questionSubject">数据结构</div>
            <div class="badge source" id="questionSource"></div>
          </div>
          <div class="question-meta">
            <div class="progress" id="questionProgress">第 -- 题</div>
            <div class="timer hidden" id="questionTimer">01:30</div>
          </div>
        </div>
        <h2 class="question-text" id="questionText"></h2>
        <div class="options" id="options"></div>
      </section>
    </main>

    <section class="footer">
      <div id="feedback" class="feedback empty">请选择一个答案，然后点击“提交答案”。</div>
      <div class="actions">
        <button class="btn btn-ghost" id="prevBtn">上一题</button>
        <button class="btn btn-ghost" id="nextBtn">下一题</button>
        <button class="btn btn-ghost" id="randomBtn">随机一题</button>
        <button class="btn btn-ghost" id="historyBtn">答题记录(0/12)</button>
        <button class="btn btn-ghost" id="ragBtn">AI 问答</button>
        <button class="btn btn-primary" id="submitBtn">提交答案</button>
      </div>
    </section>
  </div>

  <div class="history-modal" id="historyModal" aria-hidden="true">
    <div class="history-panel" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <div class="history-header">
        <h3 class="history-title" id="historyTitle">答题记录</h3>
        <button class="history-close" id="historyCloseBtn" type="button" aria-label="关闭答题记录">×</button>
      </div>
      <div id="historyContent" class="history-empty">正在加载答题记录...</div>
    </div>
  </div>

  <div class="history-modal" id="ragModal" aria-hidden="true">
    <div class="history-panel" role="dialog" aria-modal="true" aria-labelledby="ragTitle">
      <div class="history-header">
        <h3 class="history-title" id="ragTitle">AI 知识问答 · 基于 408 笔记检索</h3>
        <button class="history-close" id="ragCloseBtn" type="button" aria-label="关闭AI问答">×</button>
      </div>
      <div class="rag-controls">
        <select class="year-select" id="ragSubject" aria-label="限定科目">
          <option value="">全部科目</option>
          <option value="数据结构">数据结构</option>
          <option value="组成原理">组成原理</option>
          <option value="操作系统">操作系统</option>
          <option value="计算机网络">计算机网络</option>
        </select>
        <button class="btn btn-primary" id="ragAskBtn" type="button">提问</button>
      </div>
      <textarea class="rag-input" id="ragInput" placeholder="例如：什么是死锁？产生的必要条件有哪些？"></textarea>
      <div class="rag-status" id="ragStatus"></div>
      <div class="rag-answer" id="ragAnswer"></div>
      <div class="rag-sources" id="ragSources"></div>
    </div>
  </div>

  <div class="help-popover" id="helpPopover" aria-hidden="true">
    <div class="help-popover-header">
      <h3 class="help-popover-title">使用说明</h3>
      <button class="help-popover-close" id="helpCloseBtn" type="button" aria-label="关闭说明">×</button>
    </div>
    <div>这是一套单题练习页面：按科目切换，可筛选历年真题（支持按年份）或章节练习，答题后查看解析；点"AI 问答"可以直接问 408 知识点（基于本地知识库检索作答）。</div>
  </div>

  <script>
    const TIMER_SECONDS = 90;
    const API_URL = "/api/questions";
    const HISTORY_API_URL = "/api/history";
    let questions = [];
    let view = [];
    let questionsLoaded = false;
    let loadError = "";
    let historyRecords = [];
    let historyLoaded = false;
    let historyLoading = false;

    const state = {
      currentIndex: 0,
      selected: null,
      submitted: false,
      expired: false,
      score: 0,
      done: [],
      correct: [],
      filterQtype: "all",
      filterYear: null,
      timerEnabled: false,
      timerRemaining: TIMER_SECONDS,
      timerId: null
    };

    const els = {
      currentSubject: document.getElementById("currentSubject"),
      answeredCount: document.getElementById("answeredCount"),
      correctCount: document.getElementById("correctCount"),
      accuracyRate: document.getElementById("accuracyRate"),
      timerToggle: document.getElementById("timerToggle"),
      helpBtn: document.getElementById("helpBtn"),
      helpPopover: document.getElementById("helpPopover"),
      helpCloseBtn: document.getElementById("helpCloseBtn"),
      questionSubject: document.getElementById("questionSubject"),
      questionProgress: document.getElementById("questionProgress"),
      questionTimer: document.getElementById("questionTimer"),
      questionText: document.getElementById("questionText"),
      options: document.getElementById("options"),
      feedback: document.getElementById("feedback"),
      submitBtn: document.getElementById("submitBtn"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      randomBtn: document.getElementById("randomBtn"),
      historyBtn: document.getElementById("historyBtn"),
      historyModal: document.getElementById("historyModal"),
      historyCloseBtn: document.getElementById("historyCloseBtn"),
      historyContent: document.getElementById("historyContent"),
      tabs: Array.from(document.querySelectorAll("#subjectTabs .tab")),
      qtypeTabs: Array.from(document.querySelectorAll("#filterBar .tab")),
      yearSelect: document.getElementById("yearSelect"),
      questionSource: document.getElementById("questionSource"),
      totalCount: document.getElementById("totalCount"),
      ragBtn: document.getElementById("ragBtn"),
      ragModal: document.getElementById("ragModal"),
      ragCloseBtn: document.getElementById("ragCloseBtn"),
      ragSubject: document.getElementById("ragSubject"),
      ragInput: document.getElementById("ragInput"),
      ragAskBtn: document.getElementById("ragAskBtn"),
      ragStatus: document.getElementById("ragStatus"),
      ragAnswer: document.getElementById("ragAnswer"),
      ragSources: document.getElementById("ragSources")
    };

    function formatTime(totalSeconds){
      const m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
      return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    }

    function clearTimer(){
      if (state.timerId !== null) { clearInterval(state.timerId); state.timerId = null; }
    }

    function buildView(){
      view = questions.filter(q => {
        if (state.filterQtype === "exam" && q.qtype !== "exam") return false;
        if (state.filterQtype === "chapter" && q.qtype !== "chapter") return false;
        if (state.filterYear && q.year !== state.filterYear) return false;
        return true;
      });
    }

    function applyFilter(){
      buildView(); resetStateForQuestions(); renderQuestion(); refreshHistoryButton();
    }

    function populateYearOptions(){
      const years = [...new Set(questions.filter(q => q.qtype === "exam" && q.year).map(q => q.year))].sort((a, b) => a - b);
      els.yearSelect.innerHTML = `<option value="">全部年份</option>` + years.map(y => `<option value="${y}">${y} 年</option>`).join("");
      els.yearSelect.value = state.filterYear ? String(state.filterYear) : "";
    }

    function resetStateForQuestions(){
      state.currentIndex = 0; state.selected = null; state.submitted = false; state.expired = false; state.score = 0;
      state.done = new Array(view.length).fill(false);
      state.correct = new Array(view.length).fill(false);
      state.timerRemaining = TIMER_SECONDS;
      clearTimer();
    }

    function renderTimer(){
      if (!state.timerEnabled || state.submitted || state.expired || !questionsLoaded) {
        els.questionTimer.classList.add("hidden"); els.questionTimer.classList.remove("danger"); return;
      }
      els.questionTimer.classList.remove("hidden");
      els.questionTimer.textContent = formatTime(state.timerRemaining);
      els.questionTimer.classList.toggle("danger", state.timerRemaining <= 10);
    }

    function renderStats(){
      els.answeredCount.textContent = "0";
      els.correctCount.textContent = "0";
      els.accuracyRate.textContent = "0%";
    }

    function refreshHistoryButton(){
      const uniqueAnswered = new Set(historyRecords.map(r => r.question_id)).size;
      const total = questionsLoaded ? view.length : 0;
      els.historyBtn.textContent = `答题记录(${uniqueAnswered}/${total})`;
    }

    function updateActionButtons(){
      const locked = !questionsLoaded || !!loadError;
      els.submitBtn.disabled = locked || state.submitted || state.expired;
      els.prevBtn.disabled = locked || state.currentIndex === 0;
      els.nextBtn.disabled = locked || state.currentIndex === view.length - 1;
    }

    function setActiveTab(subject){ els.tabs.forEach(tab => tab.classList.toggle("active", tab.dataset.subject === subject)); }

    function renderOptions(){
      const q = view[state.currentIndex];
      Array.from(els.options.querySelectorAll(".option")).forEach((node, idx) => {
        node.classList.toggle("selected", state.selected === idx && !state.submitted);
        node.classList.toggle("correct", state.submitted && idx === q.answer);
        node.classList.toggle("wrong", state.submitted && state.selected === idx && idx !== q.answer);
        node.disabled = state.submitted || state.expired || !questionsLoaded;
      });
    }

    function showResult(){
      const q = view[state.currentIndex];
      const isCorrect = state.selected === q.answer;
      const answerLetter = String.fromCharCode(65 + q.answer);
      const selectedLetter = state.selected === null ? "未选择" : String.fromCharCode(65 + state.selected);
      els.feedback.className = `feedback ${isCorrect ? "success" : "error"}`;
      els.feedback.innerHTML = `<div class="title">${isCorrect ? "回答正确！" : "回答错误。"}</div><div>你的答案：<strong>${selectedLetter}</strong>；正确答案：<strong>${answerLetter}</strong></div><div class="analysis">${q.analysis}</div>`;
      const askAiBtn = document.createElement("button");
      askAiBtn.type = "button";
      askAiBtn.className = "btn btn-ghost";
      askAiBtn.textContent = "AI 讲解这题";
      askAiBtn.addEventListener("click", askAiAboutCurrentQuestion);
      els.feedback.appendChild(askAiBtn);
    }

    function buildQuestionQuery(q){
      // 题干里的 <table> 等 HTML 标签对关键词检索是噪音，去掉；截断防止超长
      const stem = String(q.text)
        .replace(/<[^>]+>/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 200);
      return `请讲解这道${q.subject}题考查的知识点：${stem}`;
    }

    function askAiAboutCurrentQuestion(){
      const q = view[state.currentIndex];
      if (!q) return;
      els.ragSubject.value = "";  // 不限定科目：计网/计组语料未补齐，限定会漏检
      els.ragInput.value = buildQuestionQuery(q);
      openRag();
      askRag();
    }

    function renderIdleFeedback(message = "请选择一个答案，然后点击“提交答案”。"){
      els.feedback.className = "feedback empty";
      els.feedback.textContent = message;
    }

    function getAnswerLabelForQuestion(question, answerIndex){
      if (answerIndex === null || answerIndex === undefined || answerIndex < 0) return "未选择";
      const optionText = question?.options?.[answerIndex];
      return optionText ? `${String.fromCharCode(65 + answerIndex)}. ${optionText}` : String.fromCharCode(65 + answerIndex);
    }

    function renderHistory(){
      if (historyLoading || !historyLoaded) { els.historyContent.className = "history-empty"; els.historyContent.textContent = "正在加载答题记录..."; return; }
      if (historyRecords.length === 0) { els.historyContent.className = "history-empty"; els.historyContent.textContent = "暂无答题记录。"; return; }

      const groups = historyRecords.reduce((acc, item) => ((acc[item.subject] ||= []).push(item), acc), {});
      const wrapper = document.createElement("div");
      wrapper.className = "history-groups";
      Object.entries(groups).forEach(([subject, items]) => {
        const group = document.createElement("section");
        group.className = "history-group";
        group.innerHTML = `<h4 class="history-group-title">${subject} (${items.length})</h4>`;
        const list = document.createElement("div");
        list.className = "history-list";
        items.forEach(itemData => {
          const q = questions.find(q => q.id === itemData.question_id);
          const item = document.createElement("button");
          item.type = "button";
          item.className = "history-item";
          item.innerHTML = `
            <div class="history-item-main">
              <span>${q && q.source ? q.source : "第 " + itemData.question_id + " 题"}</span>
              <span>${itemData.subject}</span>
              <span>${itemData.is_correct ? "✅" : "❌"}</span>
            </div>
            <div class="history-item-answer">你选的答案：${q ? getAnswerLabelForQuestion(q, itemData.selected_answer) : `选项 ${String.fromCharCode(65 + itemData.selected_answer)}`}</div>
          `;
          item.addEventListener("click", () => { closeHistory(); const idx = view.findIndex(q => q.id === itemData.question_id); if (idx !== -1) goTo(idx); });
          list.appendChild(item);
        });
        group.appendChild(list); wrapper.appendChild(group);
      });
      els.historyContent.className = ""; els.historyContent.textContent = ""; els.historyContent.appendChild(wrapper);
    }

    async function refreshHistory(){
      historyLoading = true; historyLoaded = false; refreshHistoryButton(); renderHistory();
      try {
        const response = await fetch(HISTORY_API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        historyRecords = Array.isArray(data.history) ? data.history : [];
      } catch (error) {
        historyRecords = [];
        console.error("Failed to load history", error);
      } finally {
        historyLoading = false; historyLoaded = true; refreshHistoryButton(); renderHistory();
      }
    }

    function openHistory(){ renderHistory(); els.historyModal.setAttribute("aria-hidden","false"); }
    function closeHistory(){ els.historyModal.setAttribute("aria-hidden","true"); }

    function renderMarkdownLite(text){
      // 先转义 HTML 再做极简 Markdown（加粗+换行），防止内容里带标签破坏页面
      const escaped = String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      return escaped.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
    }

    function openRag(){ els.ragModal.setAttribute("aria-hidden","false"); els.ragInput.focus(); }
    function closeRag(){ els.ragModal.setAttribute("aria-hidden","true"); }

    async function askRag(){
      const query = els.ragInput.value.trim();
      if (!query) { els.ragStatus.textContent = "请先输入问题。"; return; }
      const subject = els.ragSubject.value || null;
      els.ragAskBtn.disabled = true;
      els.ragStatus.textContent = "正在检索知识库并生成回答，稍等…";
      els.ragAnswer.textContent = ""; els.ragSources.textContent = "";
      try {
        const response = await fetch("/api/rag/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, subject, top_k: 5 })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        els.ragStatus.textContent = "";
        els.ragAnswer.innerHTML = renderMarkdownLite(data.answer || "（模型没有返回内容）");
        if (Array.isArray(data.sources) && data.sources.length) {
          els.ragSources.innerHTML = `<div class="rag-sources-title">参考来源（按相关度排序）：</div>`
            + data.sources.map(s => `<div>· ${s.source_path}</div>`).join("");
        }
      } catch (error) {
        console.error("rag ask failed", error);
        els.ragStatus.textContent = "请求失败：请确认后端已启动，且在校园网内（生成用的是天大模型）。";
      } finally {
        els.ragAskBtn.disabled = false;
      }
    }

    function handleTimerExpired(){
      if (state.submitted || state.expired) return;
      if (state.selected !== null) { submitAnswer(true); return; }
      state.expired = true;
      if (questionsLoaded) { state.done[state.currentIndex] = true; state.correct[state.currentIndex] = false; }
      clearTimer(); renderIdleFeedback("时间已到，本题已标记为超时。"); renderOptions(); renderTimer(); updateActionButtons();
    }

    function startTimer(){
      clearTimer();
      if (!state.timerEnabled || state.submitted || state.expired || !questionsLoaded) { renderTimer(); return; }
      state.timerRemaining = TIMER_SECONDS; renderTimer();
      state.timerId = setInterval(() => {
        if (!state.timerEnabled || state.submitted || state.expired || !questionsLoaded) { clearTimer(); renderTimer(); return; }
        state.timerRemaining -= 1;
        if (state.timerRemaining <= 0) { state.timerRemaining = 0; renderTimer(); clearTimer(); handleTimerExpired(); return; }
        renderTimer();
      }, 1000);
    }

    function renderQuestion(){
      if (loadError) { els.currentSubject.textContent = "加载失败"; els.questionSubject.textContent = "错误"; els.questionProgress.textContent = "题库加载失败"; els.questionText.textContent = "题目加载失败，请确认后端已启动后刷新页面重试。"; els.options.innerHTML = ""; renderIdleFeedback(loadError); clearTimer(); renderTimer(); updateActionButtons(); return; }
      if (!questionsLoaded || view.length === 0) { els.currentSubject.textContent = questionsLoaded ? "无题目" : "加载中"; els.questionSubject.textContent = questionsLoaded ? "无题目" : "加载中"; els.questionProgress.textContent = "第 0 / 0 题"; els.questionText.textContent = questionsLoaded ? "当前筛选条件下没有题目，试试放宽筛选。" : "正在从后端加载题目..."; els.questionSource.textContent = ""; els.options.innerHTML = ""; renderIdleFeedback(questionsLoaded ? "当前筛选条件下没有题目。" : "正在从后端加载题目，请稍候。"); clearTimer(); renderTimer(); updateActionButtons(); return; }

      const q = view[state.currentIndex];
      els.currentSubject.textContent = q.subject; els.questionSubject.textContent = q.subject; els.questionSource.textContent = q.source || ""; els.questionProgress.textContent = `第 ${state.currentIndex + 1} / ${view.length} 题`; els.questionText.textContent = q.text; setActiveTab(q.subject);
      els.options.innerHTML = "";
      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option"; btn.type = "button"; btn.disabled = state.submitted || state.expired;
        btn.innerHTML = `<span class="option-key">${String.fromCharCode(65 + idx)}</span><span class="option-content"><div class="title">${opt}</div></span>`;
        btn.addEventListener("click", () => {
          if (state.submitted || state.expired || !questionsLoaded) return;
          state.selected = idx; renderOptions(); renderIdleFeedback("已选择答案，点击“提交答案”查看结果。");
        });
        els.options.appendChild(btn);
      });
      state.submitted ? showResult() : renderIdleFeedback();
      renderOptions(); updateActionButtons();
      if (state.timerEnabled && !state.submitted && !state.expired) startTimer(); else { clearTimer(); renderTimer(); }
    }

    function submitAnswer(fromTimer = false){
      if (!questionsLoaded || loadError || view.length === 0) return;
      if (state.selected === null) { if (fromTimer) { handleTimerExpired(); } else { renderIdleFeedback("请先选择一个选项。"); } return; }
      if (!state.done[state.currentIndex]) {
        state.done[state.currentIndex] = true;
        state.correct[state.currentIndex] = state.selected === view[state.currentIndex].answer;
        if (state.correct[state.currentIndex]) state.score += 1;
      } else {
        state.correct[state.currentIndex] = state.selected === view[state.currentIndex].answer;
      }
      state.submitted = true; state.expired = false; clearTimer(); showResult(); renderTimer(); updateActionButtons(); void persistAnswer(); void refreshHistory();
    }

    async function persistAnswer(){
      const q = view[state.currentIndex];
      try {
        await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question_id:q.id,selected_answer:state.selected})});
        await refreshStats();
      } catch (error) { console.error("Failed to persist answer", error); }
    }

    async function refreshStats(){
      try {
        const response = await fetch("/api/stats"); if (!response.ok) return;
        const data = await response.json(); els.answeredCount.textContent = data.total_answers ?? 0; els.correctCount.textContent = data.correct_answers ?? 0; els.accuracyRate.textContent = `${Math.round(data.accuracy ?? 0)}%`;
      } catch (error) { console.error("Failed to load stats", error); }
    }

    function goTo(index){ if (!questionsLoaded || loadError || view.length === 0) return; clearTimer(); state.currentIndex = index; state.selected = null; state.submitted = false; state.expired = false; renderQuestion(); }
    function goToRandomQuestion(){
      if (!questionsLoaded || loadError || view.length === 0) return;
      const subject = view[state.currentIndex].subject;
      const indices = view.map((q, idx) => ({ q, idx })).filter(item => item.q.subject === subject).map(item => item.idx);
      if (!indices.length) return;
      let nextIndex = indices[Math.floor(Math.random() * indices.length)];
      if (indices.length > 1 && nextIndex === state.currentIndex) nextIndex = indices.filter(i => i !== state.currentIndex)[0];
      goTo(nextIndex);
    }

    function openHelp(){ els.helpPopover.classList.add("open"); els.helpPopover.setAttribute("aria-hidden","false"); }
    function closeHelp(){ els.helpPopover.classList.remove("open"); els.helpPopover.setAttribute("aria-hidden","true"); }

    els.submitBtn.addEventListener("click", () => submitAnswer(false));
    els.prevBtn.addEventListener("click", () => { if (state.currentIndex > 0) goTo(state.currentIndex - 1); });
    els.nextBtn.addEventListener("click", () => { if (state.currentIndex < view.length - 1) goTo(state.currentIndex + 1); });
    els.randomBtn.addEventListener("click", goToRandomQuestion);
    els.historyBtn.addEventListener("click", openHistory);
    els.historyCloseBtn.addEventListener("click", closeHistory);
    els.ragBtn.addEventListener("click", openRag);
    els.ragCloseBtn.addEventListener("click", closeRag);
    els.ragAskBtn.addEventListener("click", askRag);
    els.tabs.forEach(tab => tab.addEventListener("click", () => { const idx = view.findIndex(q => q.subject === tab.dataset.subject); if (idx !== -1) goTo(idx); }));
    els.qtypeTabs.forEach(tab => tab.addEventListener("click", () => {
      state.filterQtype = tab.dataset.qtype;
      els.qtypeTabs.forEach(t => t.classList.toggle("active", t === tab));
      if (state.filterQtype !== "exam") { state.filterYear = null; els.yearSelect.value = ""; }
      els.yearSelect.disabled = state.filterQtype !== "exam";
      applyFilter();
    }));
    els.yearSelect.addEventListener("change", () => { state.filterYear = els.yearSelect.value ? Number(els.yearSelect.value) : null; applyFilter(); });
    els.timerToggle.addEventListener("change", () => { state.timerEnabled = els.timerToggle.checked; clearTimer(); state.expired = false; if (state.timerEnabled) state.timerRemaining = TIMER_SECONDS; state.timerEnabled && !state.submitted && questionsLoaded ? startTimer() : renderTimer(); if (!state.submitted) renderIdleFeedback(questionsLoaded ? "请选择一个答案，然后点击“提交答案”。" : "正在从后端加载题目，请稍候。"); renderOptions(); updateActionButtons(); });
    els.helpBtn.addEventListener("click", openHelp); els.helpCloseBtn.addEventListener("click", closeHelp);
    document.addEventListener("click", event => { if (event.target === els.historyModal) closeHistory(); if (event.target === els.ragModal) closeRag(); if (!els.helpPopover.contains(event.target) && event.target !== els.helpBtn) closeHelp(); });
    document.addEventListener("keydown", event => { if (event.key === "Escape") { closeHelp(); closeHistory(); closeRag(); } });

    async function loadQuestions(){
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        questions = Array.isArray(data.questions) ? data.questions : [];
        questionsLoaded = true; loadError = "";
        populateYearOptions(); els.totalCount.textContent = questions.length;
        buildView(); resetStateForQuestions(); renderQuestion(); refreshStats(); refreshHistory();
      } catch (error) {
        questions = []; questionsLoaded = false; loadError = "题目加载失败，请确认后端已启动（0.0.0.0:8000）后刷新页面。"; clearTimer(); renderQuestion();
      }
    }

    renderStats(); renderQuestion(); els.timerToggle.checked = false; updateActionButtons(); loadQuestions(); refreshStats(); refreshHistory();
  </script>
</body>
</html>
